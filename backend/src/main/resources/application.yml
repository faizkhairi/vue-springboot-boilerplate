spring:
  application:
    name: vue-springboot-boilerplate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vue_springboot}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Bound every SMTP call (ms) so a hung mail server cannot hold a
          # request thread during registration.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  url: ${APP_URL:http://localhost:5173}
  mail:
    from: ${SMTP_FROM:noreply@example.com}
  jwt:
    secret: ${JWT_SECRET}
    access-validity-ms: 900000
    refresh-validity-ms: 604800000
  security:
    # Number of trusted reverse-proxy hops in front of this app; used by
    # RateLimitFilter to pick the real client IP out of X-Forwarded-For.
    # Set 0 when the API is exposed directly (no proxy): forwarding headers
    # are then ignored.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}

cors:
  # Comma-separated origins allowed to call the API.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # An SMTP outage should not mark the API unhealthy and pull it out of a
    # load balancer; email sending already logs its own failures.
    mail:
      enabled: false
