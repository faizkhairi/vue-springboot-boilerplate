name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job checks both halves of the stack: the Spring Boot API in backend/
# and the Vue SPA in frontend/.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend format check (Spotless)
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: Frontend lint (ESLint)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Check for em dashes
        run: bash .github/scripts/check-dashes.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend compile (main and test sources)
        working-directory: backend
        run: ./gradlew compileJava compileTestJava

      - name: Frontend typecheck (vue-tsc)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs on the host runner so Testcontainers can reach Docker. The mail
      # sender is mocked in tests, so no SMTP server is needed.
      - name: Backend tests with coverage floor (JaCoCo)
        working-directory: backend
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Frontend unit tests with coverage floor (Vitest)
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.node == 24
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.node == 24
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend jar
        if: matrix.node == 24
        working-directory: backend
        run: ./gradlew bootJar

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Frontend audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      # Reads backend/gradle.lockfile and fails on any known vulnerability.
      - name: Backend audit (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=backend/gradle.lockfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vue_springboot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
    env:
      # Dummy values; nothing here reaches a real external service.
      DATABASE_URL: jdbc:postgresql://localhost:5432/vue_springboot
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long-0123456789
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      CORS_ALLOWED_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start the API
        working-directory: backend
        run: |
          ./gradlew bootJar
          nohup java -jar build/libs/*-SNAPSHOT.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
